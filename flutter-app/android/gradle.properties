org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true

# Pin Gradle's JVM to the JetBrains Runtime bundled with Android Studio
# (OpenJDK 21). AGP 8.x requires JDK 17+, JBR satisfies that.
# If you later install a standalone JDK 17, change this path accordingly.
org.gradle.java.home=C:/Program Files/Android/Android Studio/jbr
# Built-in Kotlin (Flutter 3.44+ / AGP 9+) — do not apply kotlin-android in app/build.gradle.kts
android.builtInKotlin=true
android.newDsl=true
