name: sahel_agriconnect
description: Sahel AgriConnect & AfriYield Exchange — African Agricultural Platform
version: 1.0.0+1
publish_to: none

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # HTTP & API
  dio: ^5.4.0

  # State management
  provider: ^6.1.1
  shared_preferences: ^2.3.2

  # Navigation
  go_router: ^14.6.2
  app_links: ^6.4.1

  # UI & Design
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  lottie: ^3.1.0

  # Animations
  flutter_animate: ^4.5.0
  animated_text_kit: ^4.2.2

  # Camera & AI tools
  image_picker: ^1.1.2
  camera: ^0.11.0+2

  # Charts
  fl_chart: ^0.67.0

  # Firebase & push
  firebase_core: ^4.9.0
  firebase_messaging: ^16.2.2
  flutter_local_notifications: ^18.0.1

  # Auth & biometrics
  local_auth: ^2.2.0

  # Utilities
  intl: ^0.20.2
  url_launcher: ^6.2.5
  webview_flutter: ^4.10.0
  share_plus: ^10.1.2
  connectivity_plus: ^6.0.3
  flutter_secure_storage: ^9.0.0
  jwt_decoder: ^2.0.1
  geolocator: ^13.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
  adaptive_icon_background: "#1a3c2e"
  adaptive_icon_foreground: "assets/images/logo.png"
  min_sdk_android: 21
  web:
    generate: false

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/animations/
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
